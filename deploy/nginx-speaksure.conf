server {
    listen 80;
    server_name your-domain.com;

    # Audio uploads; keep in step with MAX_UPLOAD_BYTES in /etc/speaksure.env.
    client_max_body_size 100M;

    root /var/www/speaksure;
    index index.html;

    # SPA fallback for react-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/predict runs wav2vec2 + AssemblyAI + Gemini synchronously and
        # can legitimately take minutes. Must exceed gunicorn --timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Stream uploads straight through instead of spooling them to disk.
        proxy_request_buffering off;
    }
}
